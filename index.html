<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>XAUUSD · BTCUSD — Chart</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#131722;--ln:#2a2e39;--tx:#d1d4dc;--mu:#787b86}

#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
#top,#bot{display:flex;align-items:center;padding:0 4px;flex:none;overflow-x:auto;white-space:nowrap;background:var(--bg)}
#top{height:40px;border-bottom:1px solid var(--ln)}
#bot{height:34px;border-top:1px solid var(--ln);justify-content:space-between;padding-bottom:env(safe-area-inset-bottom)}
.b{background:none;border:0;border-radius:4px;color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;height:32px;min-width:32px;padding:0 8px;font:inherit;font-weight:500;appearance:none;-webkit-appearance:none}
.b:hover{background:var(--ln)}.b.on{color:#2962ff}
#tfs .b.on,#rg .b:active{background:rgba(41,98,255,.18)}

select.b option{background:#1e222d;color:var(--tx)}
.sep{width:1px;height:20px;background:var(--ln);margin:0 6px;flex:none}
#main{flex:1;display:flex;min-height:0}
#tools{width:48px;flex:none;border-right:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;overflow-y:auto;scrollbar-width:none}
#tools .b{width:40px;height:38px;padding:0;flex:none;color:#b2b5be}
#tools .b:hover{color:#fff}#tools .b.on{background:rgba(41,98,255,.18);color:#2962ff}
#tools hr{width:26px;border:0;border-top:1px solid var(--ln);margin:5px 0;flex:none}
#wrap{flex:1;position:relative;min-width:0;overflow:hidden;background:var(--bg)}

#wm b{font-size:min(11vw,84px);font-weight:700;letter-spacing:-1px}#wm span{font-size:min(4vw,22px)}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#lg{position:absolute;left:12px;top:8px;z-index:6;pointer-events:none;font-size:12px;line-height:1.6;text-shadow:0 0 3px #131722,0 0 6px #131722}
#lg .l1{color:var(--tx);font-size:13px}#lg span{color:#9598a1;margin:0 2px 0 6px}#lg span:first-child{margin-left:0}
#msg{white-space:pre-line;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:7;pointer-events:none;color:var(--mu);font-size:14px;text-align:center;padding:20px}
#fl{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:9;display:none;align-items:center;gap:1px;background:#1e222d;border:1px solid var(--ln);border-radius:6px;padding:3px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
#fl .b{height:30px;min-width:30px;padding:0 6px}#fl .b.on{background:rgba(41,98,255,.25)}

</style></head>
<body><div id="app">
<div id="top">
 <select id="sy" class="b" style="font-weight:700;font-size:14px"><option>BTCUSD</option><option>XAUUSD</option></select>
 <i class="sep"></i><span id="tfs"></span><i class="sep"></i>
 <select id="ct" class="b"><option value="candle">Candles</option><option value="line">Line</option><option value="area">Area</option></select>
 <i class="sep"></i><span id="acts"></span>
</div>

 <div id="wrap"><div id="wm"></div><div id="chart"></div><canvas id="ov"></canvas><div id="lg"></div><div id="msg"></div>
  <div id="fl"><input type="color" id="col" value="#2962ff" title="Warna"><select id="lw" class="b" title="Ketebalan"><option>1</option><option selected>2</option><option>3</option><option>4</option></select><button class="b" id="ds" title="Putus-putus"></button><button class="b" id="lk" title="Kunci"></button><button class="b" id="cl" title="Duplikat"></button><button class="b" id="dl" title="Hapus"></button></div>
 </div>
</div>
<div id="bot"><span id="rg"></span><span id="clk"></span></div>
</div>
<script>
const SYMS={BTCUSD:{name:'Bitcoin / U.S. Dollar',P:[['BINANCE','vision','BTCUSDT'],['BYBIT','bybit','BTCUSDT'],['BINANCE','spot','BTCUSDT']]},
 XAUUSD:{name:'Gold Spot / U.S. Dollar',P:[['BINANCE · PERP','fut','XAUUSDT'],['BYBIT · PERP','bybit','XAUUSDT'],['BINANCE · PAXG','vision','PAXGUSDT']]}};
const TFS={'1m':['1m',6e4],'5m':['5m',3e5],'15m':['15m',9e5],'30m':['30m',18e5],'1h':['1h',36e5],'4h':['4h',144e5],'D':['1d',864e5],'W':['1w',6048e5]};
let redoS=[];
const NEED={trend:2,ray:2,arrow:2,hray:1,hline:1,vline:1,cross:1,channel:3,pitchfork:3,fib:2,fibext:3,rect:2,ellipse:2,triangle:3,long:2,short:2,measure:2,prange:2,text:1};
const TOOLS=[['cursor','⌖','Kursor'],'|',['trend','╱','Trend Line (Alt+T)'],['ray','↗','Ray'],['arrow','➚','Arrow'],['hray','⇥','Horizontal Ray'],['hline','―','Horizontal Line (Alt+H)'],['vline','¦','Vertical Line (Alt+V)'],['cross','✛','Cross Line (Alt+C)'],['channel','⫽','Parallel Channel'],['pitchfork','Ψ','Pitchfork'],'|',['fib','Fib','Fib Retracement (Alt+F)'],['fibext','FE','Trend-Based Fib Extension'],'|',['rect','▭','Rectangle'],['ellipse','◯','Ellipse'],['triangle','△','Triangle'],['brush','✎','Brush'],'|',['long','▲','Long Position'],['short','▼','Short Position'],['measure','↔','Measure'],['prange','↕','Price Range'],['text','T','Text']];
const FIB=[[0,'#787b86'],[.236,'#f23645'],[.382,'#ff9800'],[.5,'#4caf50'],[.618,'#089981'],[.786,'#00bcd4'],[1,'#787b86']];
const FX=[[0,'#787b86'],[.618,'#089981'],[1,'#2962ff'],[1.618,'#ff9800'],[2.618,'#f23645']];
const UP='#26a69a',DN='#ef5350',LW=LightweightCharts,TZ=-new Date().getTimezoneOffset()*60;
const $=s=>document.querySelector(s),wrap=$('#wrap'),ov=$('#ov'),c=ov.getContext('2d');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const fmt=v=>v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
let sym=localStorage.sym||'BTCUSD',tf=TFS[localStorage.tf]?localStorage.tf:'1h',iv=TFS[tf][1],ctype='candle',D=[],W=0,H=0,PW=0,PH=0,dpr=1;
let tool='cursor',cur=null,sel=null,drs=[],undoS=[],hide=false,magnet=false,keep=false,col='#2962ff',lw=2,dsh=false;
let mx=null,my=null,drag=null,down=null,fresh=false,block=false,brushing=false,ws=null,gen=0,lg=0,hasMore=true,loading=false,pollT=null,askedKey=false,dirty=true,sig='',msg='',series=null;
const tags=[],draw=()=>{dirty=true};

/* ---------- chart (TradingView Lightweight Charts) ---------- */
const chart=LW.createChart($('#chart'),{autoSize:true,
 layout:{background:{type:LW.ColorType.Solid,color:'rgba(19,23,34,0)'},textColor:'#d1d4dc',fontSize:12,attributionLogo:true},
 grid:{vertLines:{color:'#1e222d'},horzLines:{color:'#1e222d'}},
 crosshair:{mode:LW.CrosshairMode.Normal,vertLine:{color:'#9598a1',style:LW.LineStyle.Dashed,labelBackgroundColor:'#363a45'},horzLine:{color:'#9598a1',style:LW.LineStyle.Dashed,labelBackgroundColor:'#363a45'}},
 rightPriceScale:{borderColor:'#2a2e39',scaleMargins:{top:.1,bottom:.08}},
 timeScale:{borderColor:'#2a2e39',timeVisible:true,secondsVisible:false,rightOffset:8,barSpacing:8,minBarSpacing:1.5}});
const toLW=b=>({time:Math.floor(b.t/1000)+TZ,open:b.o,high:b.h,low:b.l,close:b.c,value:b.c});
function mkSeries(){if(series)chart.removeSeries(series);
 series=ctype==='candle'?chart.addSeries(LW.CandlestickSeries,{upColor:UP,downColor:DN,borderVisible:false,wickUpColor:UP,wickDownColor:DN}):
 ctype==='line'?chart.addSeries(LW.LineSeries,{color:'#2962ff',lineWidth:2}):
 chart.addSeries(LW.AreaSeries,{lineColor:'#2962ff',topColor:'rgba(41,98,255,.35)',bottomColor:'rgba(41,98,255,0)',lineWidth:2});
 series.setData(D.map(toLW));draw()}
const nz=v=>v==null?-1e5:v;
const X=i=>nz(chart.timeScale().logicalToCoordinate(i)),I=x=>{const v=chart.timeScale().coordinateToLogical(x);return v==null?0:v};
const Y=p=>nz(series.priceToCoordinate(p)),P=y=>{const v=series.coordinateToPrice(y);return v==null?0:v};
function tI(t){const n=D.length,L=D[n-1].t;if(t<=D[0].t)return(t-D[0].t)/iv;if(t>=L)return n-1+(t-L)/iv;let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;D[m].t<=t?lo=m:hi=m}return lo+(t-D[lo].t)/(D[hi].t-D[lo].t)}
function iT(i){const n=D.length;if(i<=0)return D[0].t+i*iv;if(i>=n-1)return D[n-1].t+(i-(n-1))*iv;const j=Math.floor(i);return D[j].t+(i-j)*(D[j+1].t-D[j].t)}
const pxy=q=>[X(tI(q.t)),Y(q.p)];
function sp(x,y){let i=I(x),p=P(y);if(magnet){i=Math.round(i);const b=D[i];if(b){let best=30,bp=null;[b.o,b.h,b.l,b.c].forEach(v=>{const d=Math.abs(Y(v)-y);if(d<best){best=d;bp=v}});if(bp!==null)p=bp}}return{t:iT(i),p}}
function T(s,x,y,cl,f,al){c.fillStyle=cl;c.font=f||'12px sans-serif';c.textAlign=al||'left';c.fillText(s,x,y)}
function ln(a,b,cl,w,dash){c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.strokeStyle=cl;c.lineWidth=w||1;c.setLineDash(dash||[]);c.stroke();c.setLineDash([])}
function nice(r,n){const raw=r/n,m=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/m;return(f<1.5?1:f<3?2:f<7?5:10)*m}
function dseg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function rayEnd(p){const dx=p[1][0]-p[0][0],dy=p[1][1]-p[0][1],l=Math.hypot(dx,dy)||1;return[p[0][0]+dx/l*5000,p[0][1]+dy/l*5000]}
function chan(p){const dx=p[1][0]-p[0][0]||1e-6,yAt=p[0][1]+(p[1][1]-p[0][1])*(p[2][0]-p[0][0])/dx,o=p[2][1]-yAt;return[[p[0][0],p[0][1]+o],[p[1][0],p[1][1]+o]]}
function fmtT(t,full){const d=new Date(t),p=n=>String(n).padStart(2,'0'),M=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
 const day=`${d.getDate()} ${M[d.getMonth()]} '${String(d.getFullYear()).slice(2)}`,hm=`${p(d.getHours())}:${p(d.getMinutes())}`;
 if(full)return tf==='1D'||tf==='1W'?day:day+'  '+hm;
 if(tf==='1D'||tf==='1W')return d.getMonth()===0&&d.getDate()<=7?String(d.getFullYear()):`${d.getDate()} ${M[d.getMonth()]}`;
 return d.getHours()===0&&d.getMinutes()===0?`${d.getDate()} ${M[d.getMonth()]}`:hm}


/* ---------- data (tanpa API key, beberapa sumber cadangan) ---------- */
const BYB={'1m':'1','5m':'5','15m':'15','30m':'30','1h':'60','4h':'240','D':'D','W':'W'},pv={};
const URLS={spot:'https://api.binance.com/api/v3/klines',vision:'https://data-api.binance.vision/api/v3/klines',fut:'https://fapi.binance.com/fapi/v1/klines'};
async function fetchP(p,end,lim){const k=p[1],s=p[2];let u;
 if(k==='bybit')u=`https://api.bybit.com/v5/market/kline?category=linear&symbol=${s}&interval=${BYB[tf]}&limit=${Math.min(lim||1000,1000)}`+(end?`&end=${end}`:'');
 else u=URLS[k]+`?symbol=${s}&interval=${TFS[tf][0]}&limit=${lim||(k==='fut'?1500:1000)}`+(end?`&endTime=${end}`:'');
 const r=await fetch(u);if(!r.ok)throw'HTTP '+r.status;const j=await r.json();
 const a=k==='bybit'?(j.retCode===0?j.result.list.slice().reverse():null):j;if(!Array.isArray(a))throw'data kosong';
 return a.map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4]}))}
async function klines(end,lim){const L=SYMS[sym].P;
 if(end||lim)return fetchP(L[pv[sym]||0],end,lim);
 const errs=[];for(let i=0;i<L.length;i++){try{const k=await fetchP(L[i]);if(!k.length)throw'kosong';pv[sym]=i;return k}catch(e){errs.push(L[i][0]+': '+((e&&e.message)||e))}}
 throw errs.join(' · ')}
function showMsg(){const m=$('#msg');m.textContent=msg;const er=msg.startsWith('Gagal');m.style.pointerEvents=er?'auto':'none';m.onclick=er?load:null}
const srcLabel=()=>SYMS[sym].P[pv[sym]||0][0];
function legend(p){const b=p&&p.logical!=null&&D[Math.round(p.logical)]||D[D.length-1];if(!b)return;const S=SYMS[sym],ch=b.c-b.o,cl=b.c>=b.o?UP:DN;
 $('#lg').innerHTML=`<div class="l1"><b>${S.name}</b> · ${tf} · ${srcLabel()}</div><div style="color:${cl}"><span>O</span>${fmt(b.o)}<span>H</span>${fmt(b.h)}<span>L</span>${fmt(b.l)}<span>C</span>${fmt(b.c)} ${ch>=0?'+':''}${fmt(ch)} (${ch>=0?'+':''}${(ch/b.o*100).toFixed(2)}%)</div>`;
 $('#wm').innerHTML=`<b>${sym}, ${tf}</b><span>${S.name}</span>`}
chart.subscribeCrosshairMove(legend);
function resetView(){const n=D.length;chart.priceScale('right').applyOptions({autoScale:true});chart.timeScale().setVisibleLogicalRange({from:Math.max(0,n-120),to:n+7})}
async function load(){const g=++lg;D=[];drs=[];sel=null;cur=null;series.setData([]);msg='Memuat data…';showMsg();hasMore=true;
 try{const k=await klines();if(g!==lg)return;D=k;msg=''}
 catch(e){msg='Gagal memuat data → '+e+'\n\nJika halaman dibuka dari pratinjau aplikasi, buka lewat alamat GitHub Pages di browser. Ketuk di sini untuk coba lagi.';showMsg();return}
 try{drs=JSON.parse(localStorage['dr_'+sym]||'[]')}catch(e){drs=[]}
 series.setData(D.map(toLW));resetView();showMsg();connect();legend();draw()}
function upsert(b){const L=D[D.length-1];if(!L)return;if(L.t===b.t)D[D.length-1]=b;else if(b.t>L.t)D.push(b);else return;series.update(toLW(b));legend()}
function connect(){clearInterval(pollT);const g=++gen;pollT=setInterval(async()=>{if(document.hidden||g!==gen||!D.length)return;try{const k=await klines(0,2);if(g===gen)k.forEach(upsert)}catch(e){}},2500)}
async function more(){if(loading||!hasMore||!D.length)return;loading=true;const g=lg;
 try{const k=(await klines(D[0].t-1)).filter(b=>b.t<D[0].t);if(g===lg){if(!k.length)hasMore=false;else{const r=chart.timeScale().getVisibleLogicalRange();D=k.concat(D);series.setData(D.map(toLW));if(r)chart.timeScale().setVisibleLogicalRange({from:r.from+k.length,to:r.to+k.length})}}}catch(e){hasMore=false}
 loading=false}
chart.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r&&r.from<10)more()});

/* ---------- gambar: simpan, undo, tool ---------- */
const save=()=>{localStorage['dr_'+sym]=JSON.stringify(drs)};
const snapU=()=>{undoS.push(JSON.stringify(drs));redoS=[];if(undoS.length>50)undoS.shift()};
function undo(){if(!undoS.length)return;redoS.push(JSON.stringify(drs));drs=JSON.parse(undoS.pop());sel=null;save();draw()}
function redo(){if(!redoS.length)return;undoS.push(JSON.stringify(drs));drs=JSON.parse(redoS.pop());sel=null;save();draw()}
function del(){if(sel){snapU();drs=drs.filter(d=>d!==sel);sel=null;save()}else if(drs.length&&confirm('Hapus semua gambar di '+sym+'?')){snapU();drs=[];save()}draw()}
function clone(){if(!sel)return;snapU();const d=JSON.parse(JSON.stringify(sel));d.id=Date.now();d.lock=false;d.pts=d.pts.map(q=>({t:q.t+iv*3,p:q.p}));drs.push(d);sel=d;save();draw()}
function syncProps(){if(sel){col=sel.color;lw=sel.w||2;dsh=!!sel.dash}$('#col').value=col;$('#lw').value=lw;$('#ds').classList.toggle('on',dsh);$('#lk').classList.toggle('on',!!(sel&&sel.lock))}
function setTool(t){tool=t;cur=null;brushing=false;wrap.classList.toggle('dw',t!=='cursor');document.querySelectorAll('#tools [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));draw()}
function finish(){const d=cur;cur=null;brushing=false;
 if(d.type==='text'){const t=prompt('Teks:');if(!t){setTool('cursor');return}d.text=t}
 if(d.type==='long'||d.type==='short')d.pts[2]={t:d.pts[1].t,p:2*d.pts[0].p-d.pts[1].p};
 drs.push(d);sel=d;save();syncProps();if(keep)draw();else setTool('cursor')}
function place(x,y){const pt=sp(x,y);
 if(!cur){snapU();cur={id:Date.now(),type:tool,pts:[pt],color:col,w:lw,dash:dsh};fresh=true}else{cur.pts.push(pt);fresh=false}
 if(cur.pts.length>=NEED[cur.type])finish()}

/* ---------- render overlay ---------- */
function drawOne(d,sel_){
 const p=d.pts.map(pxy),cl=d.color;c.setLineDash(d.dash?[7,5]:[]);c.globalAlpha=1;c.strokeStyle=cl;c.fillStyle=cl;c.lineWidth=(d.w||2)+(sel_&&d===sel?1:0);
 const L=(a,b)=>{c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke()},A=v=>{c.globalAlpha=v};
 switch(d.type){
 case'trend':if(p[1])L(p[0],p[1]);break;
 case'ray':if(p[1])L(p[0],rayEnd(p));break;
 case'hline':L([0,p[0][1]],[PW,p[0][1]]);tags.push({y:p[0][1],txt:fmt(d.pts[0].p),bg:cl});break;
 case'vline':L([p[0][0],0],[p[0][0],PH]);break;
 case'rect':if(p[1]){A(.15);c.fillRect(p[0][0],p[0][1],p[1][0]-p[0][0],p[1][1]-p[0][1]);A(1);c.strokeRect(p[0][0],p[0][1],p[1][0]-p[0][0],p[1][1]-p[0][1])}break;
 case'fib':if(p[1]){const x0=Math.min(p[0][0],p[1][0]),x1=Math.max(p[0][0],p[1][0]);c.setLineDash([4,4]);A(.6);L(p[0],p[1]);c.setLineDash([]);
  const ys=FIB.map(([l])=>Y(d.pts[1].p-(d.pts[1].p-d.pts[0].p)*l));
  FIB.forEach(([l,k],j)=>{c.strokeStyle=k;c.fillStyle=k;c.lineWidth=1;A(1);L([x0,ys[j]],[x1,ys[j]]);c.font='11px sans-serif';c.textAlign='left';c.fillText(`${l} (${fmt(d.pts[1].p-(d.pts[1].p-d.pts[0].p)*l)})`,x0+4,ys[j]-3);
   if(j<FIB.length-1){A(.07);c.fillRect(x0,Math.min(ys[j],ys[j+1]),x1-x0,Math.abs(ys[j+1]-ys[j]))}});A(1)}break;
 case'channel':if(p[1]){L(p[0],p[1]);if(p[2]){const q=chan(p);L(q[0],q[1]);A(.1);c.beginPath();c.moveTo(p[0][0],p[0][1]);c.lineTo(p[1][0],p[1][1]);c.lineTo(q[1][0],q[1][1]);c.lineTo(q[0][0],q[0][1]);c.fill();A(.5);c.setLineDash([4,4]);L([(p[0][0]+q[0][0])/2,(p[0][1]+q[0][1])/2],[(p[1][0]+q[1][0])/2,(p[1][1]+q[1][1])/2]);A(1)}}break;
 case'long':case'short':if(p[1]){const e=p[0][1],x0=Math.min(p[0][0],p[1][0]),w=Math.max(Math.abs(p[1][0]-p[0][0]),40),tp=p[1][1],sl=p[2]?p[2][1]:2*e-tp;
  A(.22);c.fillStyle='#089981';c.fillRect(x0,Math.min(e,tp),w,Math.abs(tp-e));c.fillStyle='#f23645';c.fillRect(x0,Math.min(e,sl),w,Math.abs(sl-e));A(1);
  ln([x0,e],[x0+w,e],'#9598a1',1);const rw=Math.abs(P(tp)-P(e)),rk=Math.abs(P(e)-P(sl)),pc=(P(tp)-P(e))/P(e)*100;

/* ---------- hit test ---------- */
function bodyHit(d,x,y){const p=d.pts.map(pxy),S=(a,b)=>dseg(x,y,a[0],a[1],b[0],b[1])<8;
 switch(d.type){
 case'trend':case'measure':return S(p[0],p[1]);
 case'ray':return S(p[0],rayEnd(p));
 case'hline':return Math.abs(y-p[0][1])<8;
 case'vline':return Math.abs(x-p[0][0])<8;
 case'rect':{const x0=Math.min(p[0][0],p[1][0]),x1=Math.max(p[0][0],p[1][0]),y0=Math.min(p[0][1],p[1][1]),y1=Math.max(p[0][1],p[1][1]);return x>=x0-4&&x<=x1+4&&y>=y0-4&&y<=y1+4}
 case'fib':{const x0=Math.min(p[0][0],p[1][0]),x1=Math.max(p[0][0],p[1][0]);return x>=x0&&x<=x1&&FIB.some(([l])=>Math.abs(y-Y(d.pts[1].p-(d.pts[1].p-d.pts[0].p)*l))<8)}
 case'channel':{const q=chan(p);return S(p[0],p[1])||S(q[0],q[1])}
 case'long':case'short':{const x0=Math.min(p[0][0],p[1][0]),w=Math.max(Math.abs(p[1][0]-p[0][0]),40),ys=p.map(a=>a[1]);return x>=x0&&x<=x0+w&&y>=Math.min(...ys)&&y<=Math.max(...ys)}
 case'arrow':return S(p[0],p[1]);
 case'hray':return Math.abs(y-p[0][1])<8&&x>=p[0][0]-6;
 case'cross':return Math.abs(y-p[0][1])<8||Math.abs(x-p[0][0])<8;
 case'ellipse':{const cx=(p[0][0]+p[1][0])/2,cy=(p[0][1]+p[1][1])/2,rx=Math.abs(p[1][0]-p[0][0])/2+6,ry=Math.abs(p[1][1]-p[0][1])/2+6;return((x-cx)/rx)**2+((y-cy)/ry)**2<=1}
 case'triangle':return S(p[0],p[1])||S(p[1],p[2])||S(p[2],p[0]);
 case'brush':return p.some((q,i)=>i&&S(p[i-1],q));
 case'pitchfork':{const m=[(p[1][0]+p[2][0])/2,(p[1][1]+p[2][1])/2],v=[m[0]-p[0][0],m[1]-p[0][1]],e=k=>[k[0]+v[0]*40,k[1]+v[1]*40];return S(p[0],e(p[0]))||S(p[1],e(p[1]))||S(p[2],e(p[2]))||S(p[1],p[2])}
 case'fibext':{const x0=Math.min(p[1][0],p[2][0]),x1=Math.max(p[0][0],p[1][0],p[2][0])+120;return(x>=x0&&x<=x1&&FX.some(([l])=>Math.abs(y-Y(d.pts[2].p+(d.pts[1].p-d.pts[0].p)*l))<8))||S(p[0],p[1])||S(p[1],p[2])}

function hitTest(d,x,y){if(d===sel&&d.type!=='hline'&&d.type!=='vline'&&d.type!=='brush'){const p=d.pts.map(pxy);for(let i=0;i<p.length;i++)if(Math.hypot(p[i][0]-x,p[i][1]-y)<11)return{k:'pt',i}}
