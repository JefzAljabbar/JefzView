<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>XAUUSD · BTCUSD — Chart</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#fff;--pn:#fff;--ln:#e0e3eb;--hv:#f0f3fa;--tx:#131722;--mu:#6a6d78;--bid:#d32f2f;--ask:#1d4ed8;--tw:30px;--ic:20px;--bh:28px;--bi:17px}
body.dark{--bg:#000;--pn:#0c0c0c;--ln:#262626;--hv:#1c1c1c;--tx:#e6e6e6;--mu:#8a8a8a;--bid:#ff6b6b;--ask:#5b8cff}
*{box-sizing:border-box}
html,body{margin:0;position:fixed;inset:0;width:100%;height:100%;overscroll-behavior:none;background:var(--bg);color:var(--tx);font:13px -apple-system,BlinkMacSystemFont,"Trebuchet MS",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100%;padding-top:0;padding-bottom:env(safe-area-inset-bottom)}
.b{background:none;border:0;border-radius:4px;color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;height:32px;min-width:32px;padding:0 9px;font:inherit;font-weight:500;appearance:none;-webkit-appearance:none;flex:none}
.b:hover{background:var(--hv)}
.b svg{display:block}
select.b{padding:0 6px}select.b option{background:var(--pn);color:var(--tx)}
#main{flex:1;display:flex;min-height:0}
#tools{width:calc(var(--tw) + 6px);flex:none;border-right:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;padding:3px 0;gap:0;overflow-y:auto;scrollbar-width:none}
#tools .b{width:var(--tw);height:var(--tw);min-width:0;padding:0;color:var(--tx)}
#tools .b svg{width:var(--ic);height:var(--ic)}
#tools .b.on{background:var(--hv);color:#2962ff}
#tools hr{width:calc(var(--tw) - 8px);border:0;border-top:1px solid var(--ln);margin:3px 0;flex:none}
#col{width:22px;height:22px;border:0;padding:0;background:none;cursor:pointer;margin:3px 0;flex:none;order:99}
#wrap{flex:1;position:relative;min-width:0;overflow:hidden;background:var(--bg)}
#wrap *{touch-action:none!important}
#wrap.dw #chart *{cursor:crosshair!important}
#chart{position:absolute;inset:0;z-index:1}
#wm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:0;color:var(--mu);opacity:.16;text-align:center}
#wm b{font-size:min(11vw,84px);font-weight:700;letter-spacing:-1px}#wm span{font-size:min(4vw,22px)}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#lg{position:absolute;left:8px;top:4px;z-index:6;pointer-events:none;font-size:11px;line-height:1.4;text-shadow:0 0 3px var(--bg),0 0 6px var(--bg)}
#lg span{color:var(--mu)}
#ba{position:absolute;left:8px;top:26px;z-index:6;display:none;align-items:stretch;font-size:12px;font-weight:600;pointer-events:none}
#ba div{padding:3px 8px;background:var(--bg);border:1px solid;transition:color .2s,border-color .2s,background .2s}
#ba .bd{color:var(--bid);border-color:var(--bid);border-radius:4px 0 0 4px}#ba .ad{color:var(--ask);border-color:var(--ask);border-radius:0 4px 4px 0}
#ba .sp{color:var(--mu);border-color:var(--ln);border-left:0;border-right:0;font-weight:400}
#ba small{display:block;font-size:9px;font-weight:500;opacity:.8}
#ur{position:absolute;top:4px;right:60px;z-index:8;display:flex;gap:1px;background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:1px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
#ur .b{height:26px;min-width:28px;padding:0 3px}
#ur .b svg,#fl .b svg,#lm .b svg{width:20px;height:20px}
#msg{white-space:pre-line;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:7;pointer-events:none;color:var(--mu);font-size:14px;text-align:center;padding:20px}
#fl{position:absolute;top:34px;left:50%;transform:translateX(-50%);z-index:9;display:none;align-items:center;gap:1px;background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:3px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#fl .b{height:30px;min-width:30px;padding:0 4px}#fl .b.on{background:var(--hv);color:#2962ff}
#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;background:var(--tx);color:var(--bg);padding:7px 12px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;font-size:12px}
#bot{display:flex;align-items:center;gap:2px;padding:2px 4px;border-top:1px solid var(--ln);flex:none;background:var(--bg)}
#bot .b svg{width:var(--bi);height:var(--bi)}
#tfs{display:flex;flex:1;overflow-x:auto;scrollbar-width:none;gap:1px}
#tfs .b{height:calc(var(--bh) - 4px);min-width:30px;padding:0 6px;font-size:12px;color:var(--mu)}#tfs .b.on{background:var(--tx);color:var(--bg)}
#sb{height:calc(var(--bh) - 4px);min-width:calc(var(--bh) - 4px);padding:0 4px}
#pb{border:1px solid var(--ln);font-weight:700;font-size:12px;height:calc(var(--bh) - 2px);gap:5px;padding:0 8px 0 4px}
#pb i{font-style:normal;font-size:9px;color:var(--mu);transition:transform .15s}#pb.open i{transform:rotate(180deg)}
.bdg{width:26px;height:26px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex:none;letter-spacing:-.3px}
.bdg.sm{width:18px;height:18px;font-size:9px}
.pop{position:fixed;bottom:calc(var(--bh) + 6px + env(safe-area-inset-bottom));z-index:50;display:none;background:var(--pn);border:1px solid var(--ln);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);width:min(94vw,380px);max-height:70vh;overflow:auto}
#pm{left:6px}#sm{right:6px;width:min(94vw,340px)}
#lm{left:calc(var(--tw) + 12px);width:min(86vw,330px);max-height:55vh}
.ph{padding:9px 14px;font-weight:700;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center}
.ph small{font-weight:400;color:var(--mu);font-size:11px}
.pr{padding:8px 10px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:8px;cursor:pointer}
.pr:last-child{border:0}.pr:hover{background:var(--hv)}.pr.on{background:var(--hv);box-shadow:inset 3px 0 0 #2962ff}
.pt{flex:1;min-width:0}.pt b{display:block;font-size:15px}.pt span{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lm .pt b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#lm .pt span{font-size:11px}
.ib{height:30px;min-width:30px;padding:0}.ib.on{color:#2962ff}
.srcw{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.srcw small{font-size:10px;color:var(--mu)}
.srcsel{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;font:inherit;font-size:12px;padding:5px 22px 5px 8px;max-width:140px;appearance:none;-webkit-appearance:none;cursor:pointer;
 background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.srcsel option{background:var(--pn);color:var(--tx)}
.sr{padding:9px 14px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--ln)}.sr:last-child{border:0}.sr>span{color:var(--mu);font-size:12px}
.sr.st{flex-direction:row;align-items:center;justify-content:space-between}
.stp{display:flex;align-items:center;border:1px solid var(--ln);border-radius:8px;overflow:hidden}.stp .b{height:30px;min-width:34px;border-radius:0;font-size:16px}.stp b{min-width:32px;text-align:center}
.sr a{color:#2962ff}
.seg{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden}.seg .b{flex:1;border-radius:0;height:32px}.seg .b.on{background:var(--tx);color:var(--bg)}
</style></head>
<body><div id="app">
<div id="main"><div id="tools"><input type="color" id="col" title="Warna gambar"></div>
 <div id="wrap"><div id="wm"></div><div id="chart"></div><canvas id="ov"></canvas><div id="lg"></div>
  <div id="ba"><div class="bd"><small>BID</small><span id="bv"></span></div><div class="sp"><small>SPREAD</small><span id="spv"></span></div><div class="ad"><small>ASK</small><span id="av"></span></div></div>
  <div id="ur"></div><div id="msg"></div><div id="toast"></div>
  <div id="fl"><button class="b" id="ok" title="Selesai" style="display:none;color:#089981;font-weight:700">✓ Selesai</button><select id="lw" class="b" title="Ketebalan"><option>1</option><option>2</option><option>3</option><option>4</option></select><button class="b" id="ds" title="Putus-putus"></button><button class="b" id="lk" title="Kunci"></button><button class="b" id="cl" title="Duplikat"></button><button class="b" id="dl" title="Hapus"></button></div>
 </div>
</div>
<div id="bot"><button class="b" id="pb"></button><span id="tfs"></span><button class="b" id="sb" title="Pengaturan"></button></div>
<div class="pop" id="pm"></div><div class="pop" id="sm"></div><div class="pop" id="lm"></div>
</div>
<script>
const SYMS={BTCUSD:{name:'Bitcoin / U.S. Dollar',badge:['₿','#f7931a'],P:[['Binance','vision','BTCUSDT'],['Bybit','bybit','BTCUSDT'],['Binance (alt)','spot','BTCUSDT']]},
 XAUUSD:{name:'Gold Spot / U.S. Dollar',badge:['Au','#c9a227'],P:[['Binance Futures','fut','XAUUSDT'],['Bybit','bybit','XAUUSDT'],['Binance PAXG','vision','PAXGUSDT']]}};
const THEMES={dark:{bg:'#000',fg:'#e6e6e6',bgA:'rgba(0,0,0,.85)',grid:'#161616',bd:'#262626',txt:'#b8b8b8',ch:'#8a8a8a',lab:'#262626',up:'#ffffff',dn:'#000000',ub:'#ffffff',db:'#ffffff',dcol:'#ffffff',bid:'#ff6b6b',ask:'#5b8cff',meta:'#000000'},
 light:{bg:'#fff',fg:'#131722',bgA:'rgba(255,255,255,.88)',grid:'#f0f3fa',bd:'#e0e3eb',txt:'#131722',ch:'#9598a1',lab:'#131722',up:'#ffffff',dn:'#000000',ub:'#000000',db:'#000000',dcol:'#000000',bid:'#d32f2f',ask:'#1d4ed8',meta:'#ffffff'}};
let theme=localStorage.theme2==='dark'?'dark':'light',TH=THEMES[theme],zone=['local','NY','UTC'].includes(localStorage.zone)?localStorage.zone:'local';
/* pengaturan tampilan (disimpan) */
const UD={fs:10,pt:6,pb:5,ro:5,bs:8,dfs:11,lgs:11,tw:30,bh:28,grid:1,ba:0};
let UI={...UD};try{Object.assign(UI,JSON.parse(localStorage.ui||'{}'))}catch(e){}
const lum=h=>{const n=parseInt(String(h).slice(1),16);return(n>>16&255)*.3+(n>>8&255)*.59+(n&255)*.11};
const isMono=h=>!h||h==='auto'||(/^#[0-9a-f]{6}$/i.test(h)&&(lum(h)<45||lum(h)>215));
const rc=c=>isMono(c)?TH.dcol:c;
const ZN={local:undefined,NY:'America/New_York',UTC:'UTC'};
const TFS={'1m':['1m',6e4],'5m':['5m',3e5],'15m':['15m',9e5],'30m':['30m',18e5],'1h':['1h',36e5],'4h':['4h',144e5],'D':['1d',864e5],'W':['1w',6048e5]};
let redoS=[];
const NEED={trend:2,ray:2,arrow:2,hray:1,hline:1,vline:1,channel:3,fib:2,fibext:3,rect:2,long:2,short:2,measure:2,prange:2,text:1};
const TN={trend:'Trend Line',ray:'Ray',arrow:'Arrow',hray:'Horizontal Ray',hline:'Horizontal Line',vline:'Vertical Line',channel:'Parallel Channel',fib:'Fib Retracement',fibext:'Fib Extension',rect:'Rectangle',brush:'Brush',long:'Long Position',short:'Short Position',measure:'Date & Price Range',prange:'Price Range',text:'Text'};
const TOOLS=[['cursor','','Crosshair'],'|',['trend','','Trend Line (Alt+T)'],['ray','','Ray'],['arrow','','Arrow'],['hray','','Horizontal Ray'],['hline','','Horizontal Line (Alt+H)'],['vline','','Vertical Line (Alt+V)'],['channel','','Parallel Channel'],'|',['fib','','Fib Retracement (Alt+F)'],['fibext','','Trend-Based Fib Extension'],'|',['rect','','Rectangle / OB / FVG (Alt+R)'],['brush','','Brush'],'|',['long','','Long Position'],['short','','Short Position'],['measure','','Date & Price Range'],['prange','','Price Range'],'|',['text','','Text']];
const FIB=[[0,'#9a9a9a'],[.5,'#9a9a9a'],[.62,'#e0b030'],[.705,'#e0b030'],[.79,'#e0b030'],[1,'#9a9a9a'],[-.27,'#2962ff'],[-.62,'#2962ff']];
const FX=[[0,'#787b86'],[.618,'#089981'],[1,'#2962ff'],[1.618,'#ff9800'],[2.618,'#f23645']];
const LW=LightweightCharts;
const $=s=>document.querySelector(s),wrap=$('#wrap'),ov=$('#ov'),c=ov.getContext('2d');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const fmt=v=>v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[k]));
const F=n=>`${UI.dfs+n}px sans-serif`;
let sym=SYMS[localStorage.sym]?localStorage.sym:'BTCUSD',tf=TFS[localStorage.tf]?localStorage.tf:'1h',dtf=tf,iv=TFS[tf][1],dispSym=null,busy=false,D=[],W=0,H=0,PW=0,PH=0,dpr=1;
let tool='cursor',cur=null,sel=null,drs=[],undoS=[],hide=false,magnet=localStorage.magnet==='1',keep=localStorage.keep==='1',col='auto',lw=1,dsh=false;
let TOL=8,mx=null,my=null,drag=null,down=null,pend=false,block=false,brushing=false,ws=null,gen=0,lg=0,hasMore=true,loading=false,pollT=null,dirty=true,sig='',lsig='',msg='',series=null;
let free=false,restoring=false,ft=null,fp=null; /* free = mode skala harga bebas (autoScale mati) */
const tags=[],draw=()=>{dirty=true};
let adj=null; /* mode setting titik: {d,i,cx,cy,lx,ly,moving,out,drag} */

/* ---------- chart (TradingView Lightweight Charts) ---------- */
const chart=LW.createChart($('#chart'),{autoSize:true,
 layout:{background:{type:LW.ColorType.Solid,color:'rgba(0,0,0,0)'},textColor:TH.txt,fontSize:UI.fs,attributionLogo:false},
 grid:{vertLines:{color:TH.grid,visible:!!UI.grid},horzLines:{color:TH.grid,visible:!!UI.grid}},
 crosshair:{mode:LW.CrosshairMode.Normal,vertLine:{color:TH.ch,style:LW.LineStyle.Dashed,labelBackgroundColor:TH.lab},horzLine:{color:TH.ch,style:LW.LineStyle.Dashed,labelBackgroundColor:TH.lab}},
 rightPriceScale:{borderColor:TH.bd,minimumWidth:0,ticksVisible:false,scaleMargins:{top:UI.pt/100,bottom:UI.pb/100}},
 timeScale:{borderColor:TH.bd,timeVisible:true,secondsVisible:false,ticksVisible:false,rightOffset:UI.ro,barSpacing:UI.bs,minBarSpacing:1.5}});
const toLW=b=>({time:Math.floor(b.t/1000),open:b.o,high:b.h,low:b.l,close:b.c});
function mkSeries(){if(series)chart.removeSeries(series);
 series=chart.addSeries(LW.CandlestickSeries,{upColor:TH.up,downColor:TH.dn,borderVisible:true,borderUpColor:TH.ub,borderDownColor:TH.db,wickUpColor:TH.ub,wickDownColor:TH.db,
  autoscaleInfoProvider:b=>fp?{priceRange:{minValue:fp.lo,maxValue:fp.hi}}:b()});
 series.setData(D.map(toLW));draw()}
const nz=v=>v==null?-1e5:v;
const X=i=>nz(chart.timeScale().logicalToCoordinate(i)),I=x=>{const v=chart.timeScale().coordinateToLogical(x);return v==null?0:v};
const Y=p=>nz(series.priceToCoordinate(p)),P=y=>{const v=series.coordinateToPrice(y);return v==null?0:v};
/* waktu asli ↔ indeks logis. Titik tengah candle = open + iv/2, jadi posisi gambar sama persis di semua timeframe.
   Pemetaan murni linear terhadap waktu (iv), tidak bergantung celah data → gambar tidak bergeser antar timeframe */
function tI(t){t-=iv/2;const n=D.length,L=D[n-1].t;if(t<=D[0].t)return(t-D[0].t)/iv;if(t>=L)return n-1+(t-L)/iv;let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;D[m].t<=t?lo=m:hi=m}return lo+Math.min((t-D[lo].t)/iv,1)}
function iT(i){const n=D.length;let r;if(i<=0)r=D[0].t+i*iv;else if(i>=n-1)r=D[n-1].t+(i-(n-1))*iv;else{const j=Math.floor(i);r=D[j].t+(i-j)*iv}return r+iv/2}
const pxy=q=>[X(tI(q.t)),Y(q.p)];
function sp(x,y){let i=I(x),p=P(y);if(magnet){i=Math.round(i);const b=D[i];if(b){let best=30,bp=null;[b.o,b.h,b.l,b.c].forEach(v=>{const d=Math.abs(Y(v)-y);if(d<best){best=d;bp=v}});if(bp!==null)p=bp}}return{t:iT(i),p}}
function T(s,x,y,cl,f,al){c.fillStyle=cl;c.font=f||F(1);c.textAlign=al||'left';c.fillText(s,x,y)}
function ln(a,b,cl,w,dash){c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.strokeStyle=cl;c.lineWidth=w||1;c.setLineDash(dash||[]);c.stroke();c.setLineDash([])}
function dseg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function rayEnd(p){const dx=p[1][0]-p[0][0],dy=p[1][1]-p[0][1],l=Math.hypot(dx,dy)||1;return[p[0][0]+dx/l*5000,p[0][1]+dy/l*5000]}
function chan(p){const dx=p[1][0]-p[0][0]||1e-6,yAt=p[0][1]+(p[1][1]-p[0][1])*(p[2][0]-p[0][0])/dx,o=p[2][1]-yAt;return[[p[0][0],p[0][1]+o],[p[1][0],p[1][1]+o]]}

/* ---------- data (tanpa API key, beberapa sumber cadangan) ---------- */
const BYB={'1m':'1','5m':'5','15m':'15','30m':'30','1h':'60','4h':'240','D':'D','W':'W'},pv={};
const URLS={spot:'https://api.binance.com/api/v3/klines',vision:'https://data-api.binance.vision/api/v3/klines',fut:'https://fapi.binance.com/fapi/v1/klines'};
const BAU={spot:'https://api.binance.com/api/v3/ticker/bookTicker',vision:'https://data-api.binance.vision/api/v3/ticker/bookTicker',fut:'https://fapi.binance.com/fapi/v1/ticker/bookTicker'};
async function fetchP(p,end,lim,t){const k=p[1],s=p[2];let u;
 if(k==='bybit')u=`https://api.bybit.com/v5/market/kline?category=linear&symbol=${s}&interval=${BYB[t]}&limit=${Math.min(lim||1000,1000)}`+(end?`&end=${end}`:'');
 else u=URLS[k]+`?symbol=${s}&interval=${TFS[t][0]}&limit=${lim||(k==='fut'?1500:1000)}`+(end?`&endTime=${end}`:'');
 const r=await fetch(u);if(!r.ok)throw'HTTP '+r.status;const j=await r.json();
 const a=k==='bybit'?(j.retCode===0?j.result.list.slice().reverse():null):j;if(!Array.isArray(a))throw'data kosong';
 return a.map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4]}))}
async function klines(end,lim,t){t=t||dtf;const L=SYMS[sym].P;
 if(end||lim)return fetchP(L[pv[sym]||0],end,lim,t);
 const f=localStorage['src_'+sym],ord=(f&&f!=='auto'&&L[+f])?[+f]:L.map((_,i)=>i),errs=[];for(const i of ord){try{const k=await fetchP(L[i],0,0,t);if(!k.length)throw'kosong';pv[sym]=i;return k}catch(e){errs.push(L[i][0]+': '+((e&&e.message)||e))}}
 throw errs.join(' · ')}
async function fetchBA(g){const p=SYMS[sym].P[pv[sym]||0];try{let b,a;
 if(p[1]==='bybit'){const j=await(await fetch(`https://api.bybit.com/v5/market/tickers?category=linear&symbol=${p[2]}`)).json();const t=j.result.list[0];b=+t.bid1Price;a=+t.ask1Price}
 else{const j=await(await fetch(BAU[p[1]]+'?symbol='+p[2])).json();b=+j.bidPrice;a=+j.askPrice}
 if(g!==gen||!(b>0&&a>0))return;bid=b;ask=a;updBA()}catch(e){}}
function showMsg(){const m=$('#msg');m.textContent=msg;const er=msg.startsWith('Gagal');m.style.pointerEvents=er?'auto':'none';m.onclick=er?load:null}
const srcLabel=()=>SYMS[sym].P[pv[sym]||0][0].toUpperCase();
/* kiri atas: hanya nama pair + sumber */
function legend(){$('#lg').innerHTML=`<b>${sym}</b> <span>· ${srcLabel()}</span>`;$('#wm').innerHTML=`<b>${sym}, ${tf}</b><span>${SYMS[sym].name}</span>`}
/* ---------- skala harga bebas (free movement) ----------
   Geser sumbu harga → autoScale mati → chart bebas digerakkan. Status + rentang harga disimpan per pair
   dan dipertahankan saat ganti timeframe maupun refresh. Reset / klik dua kali sumbu harga → kembali otomatis. */
const clearFree=()=>{try{localStorage.removeItem('fr_'+(dispSym||sym))}catch(e){}};

/* ---------- hit test ---------- */
function bodyHit(d,x,y){const p=d.pts.map(pxy),S=(a,b)=>dseg(x,y,a[0],a[1],b[0],b[1])<TOL;

 case'trend':case'measure':case'arrow':return S(p[0],p[1]);
 case'ray':return S(p[0],rayEnd(p));
 case'hline':return Math.abs(y-p[0][1])<TOL;
 case'vline':return Math.abs(x-p[0][0])<TOL;
 case'rect':{const x0=Math.min(p[0][0],p[1][0]),x1=Math.max(p[0][0],p[1][0]),y0=Math.min(p[0][1],p[1][1]),y1=Math.max(p[0][1],p[1][1]);return x>=x0-4&&x<=x1+4&&y>=y0-4&&y<=y1+4}
 case'fib':{const x0=Math.min(p[0][0],p[1][0]),x1=Math.max(p[0][0],p[1][0]);return x>=x0&&x<=x1&&FIB.some(([l])=>Math.abs(y-Y(d.pts[1].p-(d.pts[1].p-d.pts[0].p)*l))<TOL)}
 case'channel':{const q=chan(p);return S(p[0],p[1])||S(q[0],q[1])}
 case'long':case'short':{const x0=Math.min(p[0][0],p[1][0]),w=Math.max(Math.abs(p[1][0]-p[0][0]),40),ys=p.map(a=>a[1]);return x>=x0&&x<=x0+w&&y>=Math.min(...ys)&&y<=Math.max(...ys)}

 case'brush':return p.some((q,i)=>i&&S(p[i-1],q));
 case'fibext':{const x0=Math.min(p[1][0],p[2][0]),x1=Math.max(p[0][0],p[1][0],p[2][0])+120;return(x>=x0&&x<=x1&&FX.some(([l])=>Math.abs(y-Y(d.pts[2].p+(d.pts[1].p-d.pts[0].p)*l))<TOL))||S(p[0],p[1])||S(p[1],p[2])}
 case'prange':return Math.abs(x-p[1][0])<34&&y>=Math.min(p[0][1],p[1][1])&&y<=Math.max(p[0][1],p[1][1]);
 case'text':return x>=p[0][0]-6&&x<=p[0][0]+(d.text||'').length*(UI.dfs*.75)+6&&Math.abs(y-p[0][1])<13}return false}
